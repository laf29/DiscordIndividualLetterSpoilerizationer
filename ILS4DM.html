<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ILS4DM</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  input, textarea {
    width: 90%;
    padding: 10px;
    margin-top: 10px;
    font-size: 1em;
  }
  #output {
    white-space: pre-wrap;
    background-color: #f0f0f0;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>
<h2>Individual Letter Spoilerizationer for Discord Messages</h2>
<p>Paste into Discord to make every letter a spoiler!</p>
<hr>
<label for="inputText">Enter your message:</label>
<input type="text" id="inputText" placeholder="Type something..." />
<p></p>
<label for="outputSpoiler">Output (click to copy):</label>
<textarea id="outputSpoiler" readonly></textarea>
<p></p>
<hr>
<p></p>
<label for="inputSpoiler">Enter spoiled message (double click to paste):</label>
<input type="text" id="inputSpoiler" placeholder="Type something..." />
<p></p>
<label for="outputText">Output (click to copy):</label>
<textarea id="outputText" readonly></textarea>
<script>
const inputTextField = document.getElementById('inputText');
const inputSpoilerField = document.getElementById('inputSpoiler');
const outputTextField = document.getElementById('outputText');
const outputSpoilerField = document.getElementById('outputSpoiler');
inputTextField.addEventListener('input', () => {
  const text = inputTextField.value;
  const transformed = text.split('')
    .map(char => '||'+char+'||')
    .join('');
  outputSpoilerField.value = transformed;
});
inputSpoilerField.addEventListener('input', () => {
  const text = inputSpoilerField.value;
  const original = text.replaceAll("||", "");
  outputTextField.value = original;
});
inputSpoilerField.addEventListener('dblclick', async () => {
  inputSpoilerField.select();
  try {
    const text = await navigator.clipboard.readText()
    document.querySelector('textarea').value += text;
    console.log('Text pasted.');
  } catch (error) {
    console.log('Failed to read clipboard. Using execCommand instead.');
    document.querySelector('textarea').focus();
    const result = document.execCommand('paste')
    console.log('document.execCommand result: ', result);
  }
});
outputTextField.addEventListener('click', () => {
  outputTextField.select();
  document.execCommand('copy');
  alert('Copied to clipboard!');
});
outputSpoilerField.addEventListener('click', () => {
  outputSpoilerField.select();
  document.execCommand('copy');
  alert('Copied to clipboard!');
});
</script>
</body>
</html>
